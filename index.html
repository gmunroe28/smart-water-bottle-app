# smart-water-bottle-app
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Water Bottle Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Load Google Gen AI SDK -->
  <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.sh/@google/genai@0.1.1"
      }
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-2xl mx-auto space-y-6">

    <!-- Header -->
    <header class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700">
      <div>
        <h1 class="text-xl font-bold text-cyan-400">AquaPulse AI</h1>
        <p class="text-xs text-slate-400" id="status-text">Status: Disconnected</p>
      </div>
      <button id="connect-btn" onclick="toggleBluetooth()" class="bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-semibold px-4 py-2 rounded-lg transition">
        Connect Bottle
      </button>
    </header>

    <!-- Main Hydration Display -->
    <main class="bg-slate-800 p-6 rounded-xl border border-slate-700 text-center space-y-4">
      <h2 class="text-sm font-medium text-slate-400 uppercase tracking-wider">Today's Intake</h2>
      <div class="text-6xl font-extrabold text-cyan-300">
        <span id="current-intake">0</span> <span class="text-2xl text-slate-400">/ <span id="target-goal">2500</span> ml</span>
      </div>

      <!-- Progress Bar -->
      <div class="w-full bg-slate-700 h-4 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-cyan-400 h-full w-0% transition-all duration-500"></div>
      </div>

      <!-- Controls for Manual Log/Simulated Drink -->
      <div class="pt-4 flex justify-center gap-3">
        <button onclick="addWater(250)" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-md text-sm border border-slate-600">
          +250 ml (Sip)
        </button>
        <button onclick="addWater(500)" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-md text-sm border border-slate-600">
          +500 ml (Gulp)
        </button>
      </div>
    </main>

    <!-- AI Coaching Component -->
    <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-semibold text-cyan-400 flex items-center gap-2">
          ✨ Gemini AI Hydration Coach
        </h3>
        <button onclick="fetchAICoaching()" id="ai-btn" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-md border border-slate-600">
          Ask AI
        </button>
      </div>

      <!-- API Key Setup Input -->
      <div class="bg-slate-900 p-3 rounded-lg border border-slate-700">
        <label for="api-key" class="block text-xs text-slate-400 mb-1">Gemini API Key:</label>
        <input type="password" id="api-key" placeholder="Enter your Gemini API key" class="w-full bg-slate-800 text-sm px-3 py-2 rounded border border-slate-700 text-slate-200 focus:outline-none focus:border-cyan-500">
      </div>

      <!-- AI Response Box -->
      <div id="ai-output" class="bg-slate-900/60 p-4 rounded-lg text-sm text-slate-300 min-h-[60px] italic">
        Click "Ask AI" to generate a personalized coach check-in based on your current intake...
      </div>
    </section>

  </div>

  <script type="module">
    import { GoogleGenAI } from '@google/genai';

    // State Variables
    let currentIntake = 0;
    const targetGoal = 2500;
    let bluetoothDevice = null;

    // Web Bluetooth UUIDs (Replace with your specific bottle's UUIDs if available)
    const WATER_SERVICE_UUID = '0000181a-0000-1000-8000-00805f9b34fb'; // Environmental Sensing standard profile
    const INTAKE_CHAR_UUID   = '00002a6e-0000-1000-8000-00805f9b34fb'; 

    window.addWater = function(amount) {
      currentIntake = Math.min(targetGoal, currentIntake + amount);
      updateUI();
    };

    function updateUI() {
      document.getElementById('current-intake').innerText = currentIntake;
      const percentage = Math.min(100, Math.round((currentIntake / targetGoal) * 100));
      document.getElementById('progress-bar').style.width = percentage + '%';
    }

    // Web Bluetooth Connection Handler
    window.toggleBluetooth = async function() {
      const statusText = document.getElementById('status-text');
      const btn = document.getElementById('connect-btn');

      if (!navigator.bluetooth) {
        alert("Web Bluetooth is not supported in this browser. Use Chrome, Edge, or Opera.");
        return;
      }

      try {
        statusText.innerText = "Status: Connecting...";
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [WATER_SERVICE_UUID]
        });

        const server = await bluetoothDevice.gatt.connect();
        statusText.innerText = `Status: Connected to ${bluetoothDevice.name || 'Smart Bottle'}`;
        btn.innerText = "Disconnect";
        btn.onclick = disconnectBluetooth;

        // Try binding to telemetry characteristic
        try {
          const service = await server.getPrimaryService(WATER_SERVICE_UUID);
          const characteristic = await service.getCharacteristic(INTAKE_CHAR_UUID);
          await characteristic.startNotifications();
          characteristic.addEventListener('characteristicvaluechanged', (e) => {
            const val = e.target.value.getUint16(0, true);
            currentIntake += val;
            updateUI();
          });
        } catch (gattErr) {
          console.warn("Connected, but custom GATT characteristics were not found. Running in UI mode.", gattErr);
        }

      } catch (err) {
        statusText.innerText = "Status: Connection Failed";
        console.error(err);
      }
    };

    function disconnectBluetooth() {
      if (bluetoothDevice && bluetoothDevice.gatt.connected) {
        bluetoothDevice.gatt.disconnect();
      }
      document.getElementById('status-text').innerText = "Status: Disconnected";
      const btn = document.getElementById('connect-btn');
      btn.innerText = "Connect Bottle";
      btn.onclick = window.toggleBluetooth;
    }

    // AI Component Handler
    window.fetchAICoaching = async function() {
      const apiKey = document.getElementById('api-key').value.trim();
      const outputEl = document.getElementById('ai-output');

      if (!apiKey) {
        outputEl.innerText = "Please enter a valid Gemini API Key above.";
        return;
      }

      outputEl.innerText = "Analyzing hydration metrics with Gemini...";

      try {
        const ai = new GoogleGenAI({ apiKey });
        const prompt = `
          You are a friendly smart water bottle AI coach. 
          Context:
          - Daily Intake Goal: ${targetGoal} ml
          - Water Consumed Today: ${currentIntake} ml
          - Completion: ${Math.round((currentIntake / targetGoal) * 100)}%
          
          Provide a 2-sentence actionable and encouraging check-in tip for the user.
        `;

        const response = await ai.models.generateContent({
          model: 'gemini-2.5-flash',
          contents: prompt,
        });

        outputEl.innerText = response.text;
      } catch (error) {
        console.error("Gemini API Error:", error);
        outputEl.innerText = "Failed to fetch AI response. Please verify your API Key.";
      }
    };
  </script>
</body>
</html>
